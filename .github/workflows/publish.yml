name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (z.B. 1.2.3)'
        required: true
        type: string

permissions: {}

jobs:
  validate-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Validate release version
        id: validate
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be a semantic version in X.Y.Z format." >&2
            exit 1
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run test suite
        run: make test

  update-and-tag:
    if: github.ref == 'refs/heads/main'
    needs: validate-and-test
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate-and-test.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.PUSH_PAT }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Update pom.xml version
        working-directory: ./backend
        run: mvn versions:set "-DnewVersion=$VERSION"

      - name: Update package.json version
        working-directory: ./frontend
        run: npm version "$VERSION" --no-git-tag-version

      - name: Import GPG key
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          git config --global user.signingkey "$GPG_KEY_ID"
          git config --global commit.gpgsign true
          git config --global user.name "David Bohl"
          git config --global user.email "david@davidbohl.org"
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}

      - name: Commit version changes
        run: |
          git add ./backend/pom.xml ./frontend/package.json ./frontend/package-lock.json
          git commit -S -m "Bump version to $VERSION"

      - name: Push changes to main branch
        run: git push origin HEAD:main

      - name: Create and push tag
        run: |
          git tag -s "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"
