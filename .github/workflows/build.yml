name: Build Docker Image
on:
  workflow_dispatch:
  repository_dispatch:
    types: [branch-updated]
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    tags:
      - 'v*'
    branches:
      - '*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  resolve-ref:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      ref: ${{ steps.refs.outputs.ref }}
    steps:
      - name: Resolve checkout ref
        id: refs
        env:
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
          DISPATCH_BRANCH: ${{ github.event.client_payload.branch }}
        run: |
          REF="${GITHUB_REF}"
          if [ "${GITHUB_EVENT_NAME}" = "repository_dispatch" ]; then
            if [ -n "$DISPATCH_TAG" ]; then
              REF="refs/tags/$DISPATCH_TAG"
            elif [ -n "$DISPATCH_BRANCH" ]; then
              REF="refs/heads/$DISPATCH_BRANCH"
            fi
          fi

          if ! git check-ref-format "$REF"; then
            printf 'Invalid checkout ref: %s\n' "$REF" >&2
            exit 1
          fi

          printf 'ref=%s\n' "$REF" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run test suite
        run: make test

  build-pull-request:
    if: github.event_name == 'pull_request'
    needs: [resolve-ref, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          context: git
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build Docker image without publishing
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish-image:
    if: github.event_name != 'pull_request'
    needs: [resolve-ref, test]
    runs-on: 
      - ubuntu-latest
      
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-ref.outputs.ref }}
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          context: git
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}.{{patch}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
