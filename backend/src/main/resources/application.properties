spring.application.name=dirigent
spring.profiles.active=local
spring.datasource.url=jdbc:sqlite:data/dirigent.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

dirigent.git.authToken=
dirigent.compose.command=docker compose
dirigent.start.all.on.startup=true
dirigent.deployments.schedule.enabled=true
dirigent.deployments.schedule.cron=0 */5 * * * *

# Log noise control (QUA-011): dirigent at INFO, frameworks at WARN. Override per package, e.g. LOGGING_LEVEL_ORG_DAVIDBOHL=debug
logging.level.root=WARN
logging.level.org.davidbohl=INFO
logging.level.org.springframework.boot.StartupInfoLogger=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{20} - %msg%n
spring.main.banner-mode=off

# Per-registry credentials for private image registries, e.g. via env vars:
# DIRIGENT_REGISTRIES_0_HOST=gitea.example.com
# DIRIGENT_REGISTRIES_0_USERNAME=myuser
# DIRIGENT_REGISTRIES_0_PASSWORD=mytoken


